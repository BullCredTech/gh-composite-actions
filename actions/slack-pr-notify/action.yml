name: Slack PR-open notification
description: >
  Ao abrir um PR, posta no Slack (Incoming Webhook) uma notificação em "ficha"
  com barra colorida. Fora do card (negrito): "Pull Request · Author: <autor>",
  com o autor mencionado (@) via user-map.json (fallback = nome do perfil
  GitHub). Dentro: título do PR, link do PR, repositório e menção ao time
  responsável.
  Só notifica PRs cuja base esteja em `target-branches` (default: main) e, por
  padrão, só depois que TODOS os checks do commit concluírem com sucesso
  (`wait-for-checks`). Lê os dados do PR do contexto
  github.event.pull_request — o workflow que chama precisa rodar em
  `on: pull_request`.

inputs:
  slack-webhook-url:
    description: Slack Incoming Webhook URL do canal de destino. Vazio -> sai sem falhar (falha fechada).
    required: false
    default: ""
  slack-bot-token:
    description: >
      Bot token do Slack (xoxb-...). Quando informado, a notificação é postada
      via chat.postMessage (em vez do webhook), o `ts` da mensagem é guardado
      num comentário oculto do PR, e no MERGE a mensagem original é EDITADA
      (🔔 -> ✅). Requer `channel-id` e que o workflow chamador inclua o evento
      `closed`. Vazio -> usa o webhook (sem edição no merge).
    required: false
    default: ""
  channel-id:
    description: ID do canal Slack (C0XXXX) para o chat.postMessage. Obrigatório quando slack-bot-token é usado.
    required: false
    default: ""
  ignore-checks:
    description: >
      Nomes de check-runs a IGNORAR na espera/decisão (separados por vírgula
      e/ou nova-linha). Um check nessa lista não conta como pendente nem como
      falha — útil pra "merge gates" que falham DE PROPÓSITO (ex.: o
      weekend/holiday merge gate, org-wide) e não devem virar ❌ na notificação.
      IMPORTANTE: use o nome do CHECK-RUN, que é o nome do JOB (não do workflow)
      — o gate org-wide tem workflow "weekend-holiday-merge-gate" mas job "gate",
      então o check-run se chama "gate". Não afeta o branch protection (o gate
      segue barrando o merge). Default cobre ambos os nomes; o caller pode
      sobrescrever/estender.
    required: false
    default: gate,weekend-holiday-merge-gate
  team-id:
    description: >
      ID do Slack User Group do time responsável (formato S0XXXXXXX). Setado ->
      a mensagem menciona <!subteam^ID> e NOTIFICA o time. Vazio -> a linha
      "Time responsável" é omitida.
    required: false
    default: ""
  bar-color:
    description: Cor (hex) da barra lateral do card no Slack (estado "Aguardando review").
    required: false
    default: "#d4a72c"
  target-branches:
    description: >
      Branches de destino (base do PR) para as quais notificar, separadas por
      vírgula e/ou nova-linha. Match exato. PR cuja base não esteja na lista ->
      sai sem notificar. Default: main.
    required: false
    default: main
  wait-for-checks:
    description: >
      "true" (default) -> espera TODOS os outros checks do commit (head SHA)
      concluírem e só notifica se todos passarem; se algum falhar, não notifica
      (a menos que notify-on-failure). "false" -> notifica imediatamente ao
      abrir o PR (comportamento antigo).
    required: false
    default: "true"
  checks-timeout:
    description: Tempo máximo (segundos) aguardando os checks concluírem. Estourou -> sai sem notificar (falha fechada). Default 1800 (30 min).
    required: false
    default: "1800"
  checks-poll-interval:
    description: Intervalo (segundos) entre as checagens de status dos checks. Default 30.
    required: false
    default: "30"
  checks-initial-grace:
    description: >
      Janela inicial (segundos) para os checks aparecerem. Se após esse tempo
      NENHUM check existir para o commit, notifica (não há o que aguardar).
      Default 60.
    required: false
    default: "60"
  notify-on-failure:
    description: >
      "false" (default) -> PR ainda não anunciado só é postado depois que os
      checks passam; com checks falhando fica em silêncio (o próximo push
      re-tenta). PR já anunciado vira ❌ se um push novo quebrar a CI.
      "true" -> no modo bot, posta logo em 🟠 "Aguardando checks" e edita pra
      ❌ na falha; no modo webhook, posta um card vermelho na falha.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Post PR notification to Slack
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
        CHANNEL_ID: ${{ inputs.channel-id }}
        IGNORE_CHECKS: ${{ inputs.ignore-checks }}
        TEAM_ID: ${{ inputs.team-id }}
        BAR_COLOR: ${{ inputs.bar-color }}
        TARGET_BRANCHES: ${{ inputs.target-branches }}
        WAIT_FOR_CHECKS: ${{ inputs.wait-for-checks }}
        CHECKS_TIMEOUT: ${{ inputs.checks-timeout }}
        CHECKS_POLL_INTERVAL: ${{ inputs.checks-poll-interval }}
        CHECKS_INITIAL_GRACE: ${{ inputs.checks-initial-grace }}
        NOTIFY_ON_FAILURE: ${{ inputs.notify-on-failure }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_BASE: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        REVIEW_STATE: ${{ github.event.review.state }}
        REPO: ${{ github.repository }}
        USER_MAP: ${{ github.action_path }}/user-map.json
      run: |
        set -euo pipefail

        # ===== APPROVED: review aprovado -> edita a mensagem pra "aprovado, aguardando merge" =====
        if [ "${EVENT_NAME:-}" = "pull_request_review" ]; then
          if [ "${REVIEW_STATE:-}" != "approved" ]; then
            echo "Review não é approved (${REVIEW_STATE:-}) — nada a editar."; exit 0
          fi
          if [ "${PR_MERGED:-}" = "true" ]; then
            echo "PR já mergeado — não rebaixa o card."; exit 0
          fi
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "::warning::approved sem bot token/channel — não dá pra editar."; exit 0
          fi
          marker="<!-- slack-pr-notify:"
          body=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body' 2>/dev/null \
            | grep -F "$marker" | tail -1 || true)
          if [ -z "$body" ]; then echo "::warning::ts não encontrado no PR #${PR_NUMBER} — nada editado."; exit 0; fi
          MSG_TS=$(printf '%s' "$body" | sed -n 's/.*ts=\([0-9.]*\).*/\1/p')
          MSG_CH=$(printf '%s' "$body" | sed -n 's/.*channel=\([A-Za-z0-9]*\).*/\1/p')
          [ -z "$MSG_CH" ] && MSG_CH="$CHANNEL_ID"
          B64=$(printf '%s' "$body" | sed -n 's|.*author=\([A-Za-z0-9+/=]*\).*|\1|p')
          if [ -n "$B64" ]; then MSG_AUTHOR=$(printf '%s' "$B64" | base64 -d 2>/dev/null || printf '%s' "${PR_AUTHOR:-}"); else MSG_AUTHOR="${PR_AUTHOR:-}"; fi
          DB64=$(printf '%s' "$body" | sed -n 's|.*desc=\([A-Za-z0-9+/=]*\).*|\1|p')
          MSG_DESC=$(printf '%s' "$DB64" | base64 -d 2>/dev/null || printf '%s' "${PR_TITLE:-}")
          if [ -z "$MSG_TS" ]; then echo "::warning::ts inválido — nada editado."; exit 0; fi
          repo_short=$(printf '%s' "$REPO" | awk -F/ '{print $NF}')
          upd=$(jq -n \
            --arg ch "$MSG_CH" --arg ts "$MSG_TS" --arg author "$MSG_AUTHOR" --arg desc "$MSG_DESC" \
            --arg url "$PR_URL" --arg repo "$repo_short" --arg team "${TEAM_ID:-}" \
            '($team | gsub("^\\s+|\\s+$"; "")) as $t |
             (if ($t | length) == 0 then "" else "\n*Time responsável:* <!subteam^" + $t + ">" end) as $teamline |
             { channel: $ch, ts: $ts, text: "🔵 Pull Request · Aprovado",
               blocks: [
                 { type: "context", elements: [ { type: "mrkdwn", text: "​" } ] },
                 { type: "section", text: { type: "mrkdwn", text: ("🔵 *Pull Request · Aprovado · Aguardando merge · Author: " + $author + "*") } }
               ],
               attachments: [ {
                 color: "#4A90D9",
                 blocks: [
                   { type: "section", text: { type: "mrkdwn", text: ("• " + $desc) } },
                   { type: "divider" },
                   { type: "section", text: { type: "mrkdwn", text: (
                       "*Repositório:* " + $repo + "\n" +
                       "*PR:* " + $url +
                       $teamline ) } }
                 ]
               } ] }')
          code=$(curl -sS -o /tmp/slack_upd.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$upd" https://slack.com/api/chat.update)
          ok=$(jq -r '.ok' /tmp/slack_upd.json 2>/dev/null || echo "false")
          echo "chat.update (approved) HTTP $code ok=$ok resp=$(cat /tmp/slack_upd.json)"
          if [ "$ok" != "true" ]; then echo "::warning::chat.update (approved) falhou (não bloqueia)."; fi
          exit 0
        fi

        # ===== CLOSED: PR fechado -> edita pra Mergeado (🟢) ou Fechado sem merge (🔴) =====
        # Só roda quando o workflow chamador inclui o evento `closed` E há bot token
        # (o `ts` da mensagem foi guardado num comentário oculto do PR na abertura).
        if [ "${EVENT_ACTION:-}" = "closed" ]; then
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${CHANNEL_ID:-}" ]; then
            echo "::warning::closed sem bot token/channel — não dá pra editar a mensagem."; exit 0
          fi
          marker="<!-- slack-pr-notify:"
          body=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body' 2>/dev/null \
            | grep -F "$marker" | tail -1 || true)
          if [ -z "$body" ]; then
            echo "::warning::ts da mensagem não encontrado no PR #${PR_NUMBER} — nada editado."; exit 0
          fi
          MSG_TS=$(printf '%s' "$body" | sed -n 's/.*ts=\([0-9.]*\).*/\1/p')
          MSG_CH=$(printf '%s' "$body" | sed -n 's/.*channel=\([A-Za-z0-9]*\).*/\1/p')
          [ -z "$MSG_CH" ] && MSG_CH="$CHANNEL_ID"
          if [ -z "$MSG_TS" ]; then echo "::warning::ts inválido — nada editado."; exit 0; fi

          # Autor + descrição: reusa os da abertura (guardados em base64).
          AUTHOR_B64=$(printf '%s' "$body" | sed -n 's|.*author=\([A-Za-z0-9+/=]*\).*|\1|p')
          if [ -n "$AUTHOR_B64" ]; then
            MSG_AUTHOR=$(printf '%s' "$AUTHOR_B64" | base64 -d 2>/dev/null || printf '%s' "${PR_AUTHOR:-}")
          else
            MSG_AUTHOR="${PR_AUTHOR:-}"
          fi
          DB64=$(printf '%s' "$body" | sed -n 's|.*desc=\([A-Za-z0-9+/=]*\).*|\1|p')
          MSG_DESC=$(printf '%s' "$DB64" | base64 -d 2>/dev/null || printf '%s' "${PR_TITLE:-}")

          # Mergeado (🟢 verde) ou fechado sem merge (🔴 vermelho).
          if [ "${PR_MERGED:-}" = "true" ]; then
            ST_EMOJI="🟢"; ST_LABEL="Mergeado"; ST_COLOR="#2da44e"
          else
            ST_EMOJI="🔴"; ST_LABEL="Fechado"; ST_COLOR="#d1242f"
          fi

          repo_short=$(printf '%s' "$REPO" | awk -F/ '{print $NF}')
          upd=$(jq -n \
            --arg ch "$MSG_CH" --arg ts "$MSG_TS" \
            --arg author "$MSG_AUTHOR" --arg desc "$MSG_DESC" \
            --arg emoji "$ST_EMOJI" --arg label "$ST_LABEL" --arg color "$ST_COLOR" \
            --arg url "$PR_URL" --arg repo "$repo_short" --arg team "${TEAM_ID:-}" \
            '($team | gsub("^\\s+|\\s+$"; "")) as $t |
             (if ($t | length) == 0 then "" else "\n*Time responsável:* <!subteam^" + $t + ">" end) as $teamline |
             { channel: $ch, ts: $ts, text: ($emoji + " Pull Request · " + $label),
               blocks: [
                 { type: "context", elements: [ { type: "mrkdwn", text: "​" } ] },
                 { type: "section", text: { type: "mrkdwn", text: ($emoji + " *Pull Request · " + $label + " · Author: " + $author + "*") } }
               ],
               attachments: [ {
                 color: $color,
                 blocks: [
                   { type: "section", text: { type: "mrkdwn", text: ("• " + $desc) } },
                   { type: "divider" },
                   { type: "section", text: { type: "mrkdwn", text: (
                       "*Repositório:* " + $repo + "\n" +
                       "*PR:* " + $url +
                       $teamline ) } }
                 ]
               } ] }')
          code=$(curl -sS -o /tmp/slack_upd.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$upd" https://slack.com/api/chat.update)
          ok=$(jq -r '.ok' /tmp/slack_upd.json 2>/dev/null || echo "false")
          echo "chat.update HTTP $code ok=$ok resp=$(cat /tmp/slack_upd.json)"
          if [ "$ok" != "true" ]; then echo "::warning::chat.update falhou (não bloqueia o merge)."; fi
          exit 0
        fi

        # ===== ABERTURA: precisa de webhook OU bot token =====
        if [ -z "${SLACK_WEBHOOK_URL:-}" ] && [ -z "${SLACK_BOT_TOKEN:-}" ]; then
          echo "::warning::sem slack-webhook-url e sem slack-bot-token — pulando notificação."
          exit 0
        fi

        # ---------- PR em draft não notifica ----------
        # Draft é rascunho: quem abre ainda não está pedindo nada de ninguém, e o card
        # cinza só ocupava o canal até virar "pronto". A notificação começa no
        # `ready_for_review` — que posta o card do zero, porque sem run anterior não há
        # `ts` guardado no PR.
        # Os ramos `pull_request_review` e `closed` ficam ACIMA desta guarda de
        # propósito: os dois apenas EDITAM um card existente. Assim, um PR aberto pronto
        # e devolvido a draft ainda resolve pra 🟢/🔴 quando fecha, em vez de ficar
        # parado em "Aguardando review" pra sempre. Draft que nunca foi anunciado não
        # tem `ts` guardado, e esses ramos saem sozinhos sem postar nada.
        if [ "${PR_DRAFT:-}" = "true" ]; then
          echo "::notice::PR #${PR_NUMBER} está em draft — não notifica."
          exit 0
        fi

        # ---------- Filtro de branch de destino (base do PR) ----------
        # Só notifica PRs cuja base esteja em TARGET_BRANCHES (default: main).
        # Aceita vírgula e/ou nova-linha como separador; match exato.
        matched="false"
        targets="$(printf '%s' "${TARGET_BRANCHES:-main}" | tr ',\n\r' '   ')"
        for b in $targets; do
          if [ "$b" = "$PR_BASE" ]; then matched="true"; break; fi
        done
        if [ "$matched" != "true" ]; then
          echo "::notice::PR tem base '${PR_BASE}', fora de target-branches ('${TARGET_BRANCHES:-main}') — não notifica."
          exit 0
        fi

        # ---------- Espera todos os checks concluírem (opcional) ----------
        # Consulta check-runs + commit statuses do head SHA, ignorando os check
        # runs do PRÓPRIO workflow run (details_url contém /actions/runs/<RUN_ID>/),
        # até tudo concluir. Só segue se todos passaram.
        # Vira função (seta CHECKS_RESULT = success|none|failure|timeout, sem sair)
        # pra rodar DEPOIS de já ter postado o card "Aguardando checks".
        CHECKS_RESULT=""
        wait_checks() {
          api="https://api.github.com/repos/${REPO}"
          sha="${PR_HEAD_SHA}"
          deadline=$(( $(date +%s) + CHECKS_TIMEOUT ))
          first_seen=""

          while :; do
            now=$(date +%s)

            # --- check runs (paginado), excluindo os do próprio run ---
            page=1; total=0; collected=0
            pending_runs=0; failed_runs=0; considered_runs=0
            while :; do
              resp=$(curl -sS \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${api}/commits/${sha}/check-runs?per_page=100&page=${page}" || echo '{}')
              total=$(printf '%s' "$resp" | jq -r '.total_count // 0')
              cnt=$(printf '%s' "$resp" | jq -r '(.check_runs // []) | length')
              filtered=$(printf '%s' "$resp" | jq -c \
                --arg rid "/actions/runs/${GITHUB_RUN_ID}/" \
                --arg ign "${IGNORE_CHECKS:-}" \
                '($ign | gsub("[,\r]"; "\n") | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $ignore |
                 [(.check_runs // [])[]
                   | select(((.details_url // "") | contains($rid)) | not)
                   | select((.name // "") as $n | ($ignore | index($n) | not))]')
              p=$(printf '%s' "$filtered" | jq -r '[.[] | select(.status != "completed")] | length')
              f=$(printf '%s' "$filtered" | jq -r '[.[] | select(.status == "completed") | (.conclusion // "") as $c | select($c=="failure" or $c=="cancelled" or $c=="timed_out" or $c=="action_required" or $c=="stale")] | length')
              c=$(printf '%s' "$filtered" | jq -r 'length')
              pending_runs=$(( pending_runs + p ))
              failed_runs=$(( failed_runs + f ))
              considered_runs=$(( considered_runs + c ))
              collected=$(( collected + cnt ))
              if [ "$cnt" -eq 0 ] || [ "$collected" -ge "$total" ]; then break; fi
              page=$(( page + 1 ))
            done

            # --- commit statuses combinados (API legada de status) ---
            st=$(curl -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/commits/${sha}/status" || echo '{}')
            st_total=$(printf '%s' "$st" | jq -r '.total_count // 0')
            st_state=$(printf '%s' "$st" | jq -r '.state // "pending"')
            status_failed="false"; status_pending="false"
            if [ "$st_total" -gt 0 ]; then
              case "$st_state" in
                failure|error) status_failed="true" ;;
                pending)       status_pending="true" ;;
              esac
            fi

            # --- decisão: só decide DEPOIS que NADA está pendente ---
            # (não marca falha no 1º check vermelho — espera todos concluírem,
            # senão um check que falha rápido, ou um "gate" latchado, viraria ❌
            # prematuro enquanto os outros ainda rodam.)
            total_checks=$(( considered_runs + st_total ))
            if [ "$total_checks" -eq 0 ]; then
              # nenhum check ainda — aguarda aparecerem até a grace inicial
              [ -z "$first_seen" ] && first_seen="$now"
              if [ $(( now - first_seen )) -ge "$CHECKS_INITIAL_GRACE" ]; then
                echo "::notice::Nenhum check encontrado após ${CHECKS_INITIAL_GRACE}s (sem checks para aguardar)."
                CHECKS_RESULT="none"; return
              fi
            elif [ "$pending_runs" -eq 0 ] && [ "$status_pending" = "false" ]; then
              # todos concluíram → agora sim decide
              if [ "$failed_runs" -gt 0 ] || [ "$status_failed" = "true" ]; then
                echo "::warning::Checks concluíram com falha (com falha=$failed_runs, status combinado='$st_state')."
                CHECKS_RESULT="failure"; return
              fi
              echo "::notice::Todos os checks concluíram com sucesso ($considered_runs check-runs + $st_total statuses)."
              CHECKS_RESULT="success"; return
            fi

            if [ "$now" -ge "$deadline" ]; then
              echo "::warning::Timeout (${CHECKS_TIMEOUT}s) aguardando checks (pendentes: check-runs=$pending_runs, status='$st_state')."
              CHECKS_RESULT="timeout"; return
            fi

            echo "Aguardando checks… (pendentes: check-runs=$pending_runs, status_state=$st_state) — nova checagem em ${CHECKS_POLL_INTERVAL}s"
            sleep "$CHECKS_POLL_INTERVAL"
          done
        }

        # ---------- Descrição = título do PR ----------
        DESC="$PR_TITLE"

        # ---------- Autor: nome do perfil GitHub (fallback = login) ----------
        AUTHOR="$PR_AUTHOR"
        if [ "$PR_AUTHOR" = "claude[bot]" ]; then
          # Bot do Claude: nome fixo + emoji custom do workspace. Não é usuário
          # Slack (não tem menção) nem tem `.name` de perfil útil, então pula a
          # consulta ao GitHub e o user-map.
          AUTHOR="Claude :claude-dancing:"
        else
          NAME=$(curl -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${PR_AUTHOR}" 2>/dev/null \
            | jq -r '.name // empty' 2>/dev/null || true)
          if [ -n "${NAME:-}" ]; then
            AUTHOR="$NAME"
          else
            echo "::warning::Sem .name para ${PR_AUTHOR} — usando login."
          fi

          # ---------- Menção ao autor (mapa estático login GitHub -> Slack ID) ----------
          # Com ID no mapa: mostra SÓ a menção <@ID> (o Slack já renderiza o nome,
          # então repetir o nome do perfil seria redundante). Sem ID: fallback pro
          # nome do perfil (nada quebra).
          if [ -f "$USER_MAP" ]; then
            SLACK_ID=$(jq -r --arg l "$PR_AUTHOR" '.[$l] // empty' "$USER_MAP" 2>/dev/null || true)
            if [ -n "${SLACK_ID:-}" ]; then
              AUTHOR="<@${SLACK_ID}>"
            else
              echo "::warning::Autor ${PR_AUTHOR} não está no user-map — usando nome."
            fi
          else
            echo "::warning::user-map.json não encontrado ($USER_MAP) — usando nome."
          fi
        fi

        # ---------- Card + fluxo (posta e edita a MESMA mensagem) ----------
        # emit_card EMOJI LABEL COLOR → payload JSON (sem channel/ts).
        emit_card() {
          jq -n \
            --arg emoji "$1" --arg label "$2" --arg color "$3" \
            --arg author "$AUTHOR" --arg desc "$DESC" \
            --arg url "$PR_URL" \
            --arg repo "$REPO" --arg team "${TEAM_ID:-}" \
            '($team | gsub("^\\s+|\\s+$"; "")) as $t |
             ($repo | split("/") | last) as $repo_short |
             (if ($t | length) == 0 then "" else "\n*Time responsável:* <!subteam^" + $t + ">" end) as $teamline |
             {
               text: ($emoji + " Pull Request · " + $label),
               blocks: [
                 { type: "context", elements: [ { type: "mrkdwn", text: "​" } ] },
                 { type: "section", text: { type: "mrkdwn", text: ($emoji + " *Pull Request · " + $label + " · Author: " + $author + "*") } }
               ],
               attachments: [ {
                 color: $color,
                 blocks: [
                   { type: "section", text: { type: "mrkdwn", text: ("• " + $desc) } },
                   { type: "divider" },
                   { type: "section", text: { type: "mrkdwn", text: (
                       "*Repositório:* " + $repo_short + "\n" +
                       "*PR:* " + $url +
                       $teamline ) } }
                 ]
               } ]
             }'
        }

        WAIT="${WAIT_FOR_CHECKS:-true}"

        # ---------- Helpers do modo bot token (card = mensagem editável) ----------
        # find_card → seta TS/CH a partir do comentário oculto mais recente do PR.
        find_card() {
          TS=""; CH=""
          [ -n "${PR_NUMBER:-}" ] || return 0
          prev=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body' 2>/dev/null \
            | grep -F "<!-- slack-pr-notify:" | tail -1 || true)
          [ -n "$prev" ] || return 0
          TS=$(printf '%s' "$prev" | sed -n 's/.*ts=\([0-9.]*\).*/\1/p')
          CH=$(printf '%s' "$prev" | sed -n 's/.*channel=\([A-Za-z0-9]*\).*/\1/p')
          [ -z "$CH" ] && CH="$CHANNEL_ID"
          return 0
        }

        # post_card CARD LABEL → chat.postMessage e guarda ts+channel+autor+desc (base64)
        # num comentário OCULTO do PR pros runs de review/merge/synchronize editarem
        # depois. (Requer pull-requests: write.)
        post_card() {
          post=$(printf '%s' "$1" | jq --arg ch "$CHANNEL_ID" '. + {channel: $ch}')
          slack_code=$(curl -sS -o /tmp/slack_resp.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$post" https://slack.com/api/chat.postMessage)
          ok=$(jq -r '.ok' /tmp/slack_resp.json 2>/dev/null || echo "false")
          echo "chat.postMessage ($2) HTTP $slack_code ok=$ok"
          if [ "$ok" != "true" ]; then
            echo "::error::chat.postMessage falhou: $(cat /tmp/slack_resp.json)"; exit 1
          fi
          TS=$(jq -r '.ts' /tmp/slack_resp.json)
          CH=$(jq -r '.channel' /tmp/slack_resp.json)
          if [ -n "${PR_NUMBER:-}" ]; then
            AUTHOR_B64=$(printf '%s' "$AUTHOR" | base64 | tr -d '\n')
            DESC_B64=$(printf '%s' "$DESC" | base64 | tr -d '\n')
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="<!-- slack-pr-notify: ts=${TS} channel=${CH} author=${AUTHOR_B64} desc=${DESC_B64} -->" >/dev/null 2>&1 \
              || echo "::warning::não consegui guardar o ts no PR — edição posterior não vai funcionar."
          fi
        }

        # update_card CARD LABEL → chat.update na mensagem TS/CH (falha não bloqueia).
        update_card() {
          upd=$(printf '%s' "$1" | jq --arg ch "$CH" --arg ts "$TS" '. + {channel: $ch, ts: $ts}')
          code=$(curl -sS -o /tmp/slack_upd.json -w "%{http_code}" \
            -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$upd" https://slack.com/api/chat.update)
          uok=$(jq -r '.ok' /tmp/slack_upd.json 2>/dev/null || echo "false")
          echo "chat.update ($2) HTTP $code ok=$uok"
          if [ "$uok" != "true" ]; then echo "::warning::chat.update falhou: $(cat /tmp/slack_upd.json)"; fi
        }

        # run_is_stale → 0 se o resultado deste run não deve mais ir pro card:
        # - PR mergeado/fechado enquanto esperávamos os checks: o run do `closed` já
        #   pôs 🟢/🔴, que é estado TERMINAL — não rebaixa;
        # - head do PR mudou (push novo): o run do `synchronize` mais novo decide, e
        #   este run não pode sobrescrever (nem anunciar) com o resultado de um SHA velho.
        run_is_stale() {
          [ -n "${PR_NUMBER:-}" ] || return 1
          pr_now=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}" 2>/dev/null || echo '{}')
          merged_now=$(printf '%s' "$pr_now" | jq -r '.merged // false')
          state_now=$(printf '%s' "$pr_now" | jq -r '.state // ""')
          head_now=$(printf '%s' "$pr_now" | jq -r '.head.sha // ""')
          if [ "$merged_now" = "true" ] || [ "$state_now" = "closed" ]; then
            echo "::notice::PR #${PR_NUMBER} já terminal (merged=$merged_now state=$state_now) — não mexe no card."
            return 0
          fi
          if [ -n "$head_now" ] && [ "$head_now" != "$PR_HEAD_SHA" ]; then
            echo "::notice::Head do PR #${PR_NUMBER} mudou (${PR_HEAD_SHA} -> ${head_now}) — o run do push novo decide."
            return 0
          fi
          return 1
        }

        if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${CHANNEL_ID:-}" ]; then
          # ===== Modo bot token: posta e depois EDITA a mesma mensagem =====
          # Se NÃO é a abertura (ex.: synchronize/reopened em novo push) e já existe
          # uma mensagem (ts no comentário oculto), EDITA a existente em vez de
          # postar nova — evita card duplicado a cada push.
          TS=""; CH=""
          if [ "${EVENT_ACTION:-}" != "opened" ]; then find_card; fi

          # ---------- PR ainda não anunciado: só anuncia com a CI verde ----------
          # Com wait-for-checks e notify-on-failure=false (default), o card só nasce
          # DEPOIS que todos os checks passam: PR com CI quebrada não aparece no canal
          # nem menciona o time. O próximo push (synchronize) re-roda a action e
          # anuncia quando a CI passar. PR já anunciado segue o fluxo abaixo (vira ❌
          # num push que quebra a CI) — o time já viu o card, apagar confundiria.
          if [ -z "$TS" ] && [ "$WAIT" = "true" ] && [ "${NOTIFY_ON_FAILURE:-false}" != "true" ]; then
            wait_checks
            case "$CHECKS_RESULT" in
              success|none) ;;
              failure) echo "::notice::Checks falharam e o PR ainda não foi anunciado — não notifica (notify-on-failure=false)."; exit 0 ;;
              *)       echo "::notice::Timeout aguardando checks — não notifica."; exit 0 ;;
            esac
            if run_is_stale; then exit 0; fi
            # Outro run (ex.: reopened logo após o opened) pode ter anunciado enquanto
            # esperávamos — ele é dono do card.
            find_card
            if [ -n "$TS" ]; then
              echo "::notice::PR #${PR_NUMBER} já foi anunciado por outro run — nada a postar."; exit 0
            fi
            post_card "$(emit_card "🟡" "Aguardando review" "$BAR_COLOR")" "Aguardando review"
            exit 0
          fi

          # Estado inicial:
          if [ "$WAIT" = "true" ]; then
            IE="🟠"; IL="Aguardando checks"; IC="#d29922"
          else
            IE="🟡"; IL="Aguardando review"; IC="$BAR_COLOR"
          fi
          card=$(emit_card "$IE" "$IL" "$IC")
          if [ -n "$TS" ]; then
            # re-push: a mensagem volta pra "Aguardando checks" enquanto a CI re-roda
            update_card "$card" "$IL, re-push"
          else
            post_card "$card" "$IL"
          fi

          # Sem wait, o card já nasceu em "Aguardando review" — nada a editar depois.
          if [ "$WAIT" != "true" ]; then exit 0; fi

          # Espera os checks e edita conforme o desfecho.
          wait_checks
          case "$CHECKS_RESULT" in
            success|none) FE="🟡"; FL="Aguardando review"; FC="$BAR_COLOR" ;;
            failure)      FE="❌"; FL="Checks falharam"; FC="#D64545" ;;
            *)            echo "::warning::timeout — card permanece em 'Aguardando checks'."; exit 0 ;;
          esac
          if run_is_stale; then exit 0; fi
          update_card "$(emit_card "$FE" "$FL" "$FC")" "$FL"
          exit 0
        fi

        # ===== Modo webhook (legado): espera checks e posta 1x (sem edição) =====
        E="🟡"; L="Aguardando review"; C="$BAR_COLOR"
        if [ "$WAIT" = "true" ]; then
          wait_checks
          case "$CHECKS_RESULT" in
            failure)
              if [ "${NOTIFY_ON_FAILURE:-false}" = "true" ]; then C="#D64545"; else echo "::notice::notify-on-failure=false — não notifica."; exit 0; fi ;;
            timeout) echo "::notice::timeout aguardando checks — não notifica."; exit 0 ;;
          esac
        fi
        payload=$(emit_card "$E" "$L" "$C")
        slack_code=$(curl -sS -o /tmp/slack_resp.txt -w "%{http_code}" \
          -X POST -H 'Content-Type: application/json' \
          --data "$payload" \
          "$SLACK_WEBHOOK_URL")
        echo "Slack (webhook) respondeu HTTP $slack_code: $(cat /tmp/slack_resp.txt)"
        if [ "$slack_code" -ge 400 ]; then
          echo "::error::Falha ao postar no Slack (HTTP $slack_code)"
          exit 1
        fi
