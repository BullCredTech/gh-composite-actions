name: Notify Slack on PR (open / approved / merged)

# Notificação de PR no Slack via a própria composite action deste repo.
# Formato e lógica vivem em actions/slack-pr-notify.
# Modo bot token: posta na abertura e EDITA a MESMA mensagem em cada transição:
# 🟠 Aguardando checks → 🔵 Aguardando review / ❌ Checks falharam
# → 🟡 Aprovado (Aguardando merge) → 🟢 Mergeado / 🔴 Fechado (sem merge).
# PR em draft NÃO notifica: o card nasce no `ready_for_review`.
# Guarda o ts num comentário oculto do PR (por isso pull-requests: write).
# Org secrets: SLACK_BOT_TOKEN, SLACK_PR_CHANNEL_ID.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted]
  # trigger-mode: event: a action não espera a CI dentro do runner (cobrava a espera
  # inteira). Quem acorda a action quando um check termina é este evento.
  # Liste aqui TODOS os workflows que rodam em PR: um workflow fora da lista não
  # acorda a action, e se ele for o último a terminar o card fica parado.
  workflow_run:
    workflows: ["CI: Security"]
    types: [completed]

# Avaliação dos checks (push no PR + CI terminando) roda uma por vez por commit, para
# dois CIs terminando juntos não postarem o card duas vezes. Review e closed só editam
# o card e ficam fora da fila (grupo próprio).
concurrency:
  group: slack-pr-notify-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || (github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.sha) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write

jobs:
  notify:
    # workflow_run de push na main, de CI cancelado, de PR de fork (roda com os secrets) ou
    # do Dependabot: pula antes de subir o runner.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.actor.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - uses: BullCredTech/gh-composite-actions/actions/slack-pr-notify@6f8560a80c94cdc129677a2bfd80f5a7e5f0b9ce # main, gh-composite-actions#37 (trigger-mode event)
        with:
          trigger-mode: event
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_PR_CHANNEL_ID }}
          team-id: S0AT79KD1PC # backend-team
